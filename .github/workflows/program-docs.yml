name: program-docs

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate_program_docs.py'
      - 'flake.nix'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate_program_docs.py'
      - 'flake.nix'

permissions:
  contents: read

jobs:
  program-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_program_docs.py
