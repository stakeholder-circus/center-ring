name: program-docs

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate_program_docs.py'
      - 'flake.nix'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/validate_program_docs.py'
      - 'flake.nix'

permissions:
  contents: read

jobs:
  program-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python scripts/validate_program_docs.py
